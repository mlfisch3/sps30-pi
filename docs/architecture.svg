<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B0BEC5"/>
    </marker>
  </defs>

  <!-- Dark canvas -->
  <rect x="0" y="0" width="1200" height="420" fill="#1A1F2B"/>

  <!-- Pi group frame -->
  <rect x="410" y="110" width="230" height="200" rx="14" fill="#121620" stroke="#546E7A" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="525" y="134" text-anchor="middle" fill="#B0BEC5" font-weight="600" font-size="13">Raspberry Pi 4</text>

  <!-- User devices group frame -->
  <rect x="800" y="50" width="340" height="330" rx="14" fill="#121620" stroke="#546E7A" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="970" y="74" text-anchor="middle" fill="#B0BEC5" font-weight="600" font-size="13">User devices</text>

  <!-- Sensor box -->
  <rect x="20" y="160" width="190" height="100" rx="10" fill="#3E2A14" stroke="#FFB74D" stroke-width="2"/>
  <text x="115" y="195" text-anchor="middle" fill="#FFCC80" font-weight="700" font-size="15">Sensirion SPS30</text>
  <text x="115" y="217" text-anchor="middle" fill="#FFCC80">particulate matter</text>
  <text x="115" y="235" text-anchor="middle" fill="#FFCC80">sensor</text>

  <!-- Daemon box -->
  <rect x="430" y="160" width="190" height="100" rx="10" fill="#1A2A42" stroke="#64B5F6" stroke-width="2"/>
  <text x="525" y="195" text-anchor="middle" fill="#90CAF9" font-weight="700" font-size="15">sps30_daemon</text>
  <text x="525" y="217" text-anchor="middle" fill="#90CAF9">systemd service</text>
  <text x="525" y="235" text-anchor="middle" fill="#90CAF9">SHDLC parser</text>

  <!-- App box -->
  <rect x="820" y="100" width="300" height="110" rx="10" fill="#2E1E3A" stroke="#CE93D8" stroke-width="2"/>
  <text x="970" y="138" text-anchor="middle" fill="#E1BEE7" font-weight="700" font-size="15">Android app</text>
  <text x="970" y="160" text-anchor="middle" fill="#E1BEE7">com.sensirion.sps30</text>
  <text x="970" y="180" text-anchor="middle" fill="#E1BEE7">phone and tablet</text>

  <!-- Wear box -->
  <rect x="820" y="260" width="300" height="110" rx="10" fill="#2E1E3A" stroke="#CE93D8" stroke-width="2"/>
  <text x="970" y="298" text-anchor="middle" fill="#E1BEE7" font-weight="700" font-size="15">Wear OS</text>
  <text x="970" y="320" text-anchor="middle" fill="#E1BEE7">complication + tile</text>
  <text x="970" y="340" text-anchor="middle" fill="#E1BEE7">watch glance</text>

  <!-- Sensor to Daemon: straight horizontal, labels centered above in the clear gap -->
  <line x1="210" y1="210" x2="424" y2="210" stroke="#B0BEC5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="186" text-anchor="middle" fill="#CFD8DC" font-size="12">UART 115200 baud</text>
  <text x="320" y="202" text-anchor="middle" fill="#CFD8DC" font-size="12">SHDLC framing</text>

  <!-- Daemon to App: L-shape; vertical step placed to the right so the horizontal
       segment is wide enough to hold the longer label with a small margin -->
  <polyline points="620,210 760,210 760,155 814,155" fill="none" stroke="#B0BEC5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="184" text-anchor="middle" fill="#CFD8DC" font-size="12">Wi-Fi TCP 8730</text>
  <text x="690" y="200" text-anchor="middle" fill="#CFD8DC" font-size="12">or BLE NUS</text>

  <!-- App to Wear: vertical arrow, label to the right in the clear gap -->
  <line x1="970" y1="210" x2="970" y2="254" stroke="#B0BEC5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="985" y="236" fill="#CFD8DC" font-size="12">Data Layer</text>
</svg>
