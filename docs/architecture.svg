<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546E7A"/>
    </marker>
  </defs>

  <!-- Sensor -->
  <g>
    <rect x="20" y="110" width="180" height="100" rx="10" fill="#FFF3E0" stroke="#FB8C00" stroke-width="2"/>
    <text x="110" y="150" text-anchor="middle" fill="#E65100" font-weight="700">Sensirion SPS30</text>
    <text x="110" y="172" text-anchor="middle" fill="#E65100">particulate matter</text>
    <text x="110" y="190" text-anchor="middle" fill="#E65100">sensor</text>
  </g>

  <!-- Pi group -->
  <g>
    <rect x="310" y="60" width="240" height="200" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="1" stroke-dasharray="6 5"/>
    <text x="430" y="88" text-anchor="middle" fill="#546E7A" font-weight="600" font-size="13">Raspberry Pi 4</text>
    <rect x="340" y="130" width="180" height="100" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
    <text x="430" y="170" text-anchor="middle" fill="#0D47A1" font-weight="700">sps30_daemon</text>
    <text x="430" y="192" text-anchor="middle" fill="#0D47A1">systemd service</text>
    <text x="430" y="210" text-anchor="middle" fill="#0D47A1">SHDLC parser</text>
  </g>

  <!-- User devices group -->
  <g>
    <rect x="650" y="20" width="290" height="280" rx="14" fill="#FAFAFA" stroke="#90A4AE" stroke-width="1" stroke-dasharray="6 5"/>
    <text x="795" y="48" text-anchor="middle" fill="#546E7A" font-weight="600" font-size="13">User devices</text>

    <rect x="680" y="70" width="230" height="90" rx="10" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/>
    <text x="795" y="104" text-anchor="middle" fill="#4A148C" font-weight="700">Android app</text>
    <text x="795" y="124" text-anchor="middle" fill="#4A148C">com.sensirion.sps30</text>
    <text x="795" y="144" text-anchor="middle" fill="#4A148C">phone and tablet</text>

    <rect x="680" y="190" width="230" height="90" rx="10" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/>
    <text x="795" y="222" text-anchor="middle" fill="#4A148C" font-weight="700">Wear OS</text>
    <text x="795" y="244" text-anchor="middle" fill="#4A148C">complication + tile</text>
    <text x="795" y="262" text-anchor="middle" fill="#4A148C">watch glance</text>

    <!-- phone -> watch (inside group) -->
    <line x1="795" y1="160" x2="795" y2="190" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="810" y="178" fill="#546E7A" font-size="11">Data Layer</text>
  </g>

  <!-- Sensor -> Pi -->
  <line x1="200" y1="160" x2="340" y2="180" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="155" text-anchor="middle" fill="#546E7A" font-size="11">UART 115200 baud</text>
  <text x="270" y="169" text-anchor="middle" fill="#546E7A" font-size="11">SHDLC framing</text>

  <!-- Pi -> App -->
  <line x1="520" y1="170" x2="680" y2="115" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="605" y="128" text-anchor="middle" fill="#546E7A" font-size="11">Wi-Fi TCP 8730</text>
  <text x="605" y="142" text-anchor="middle" fill="#546E7A" font-size="11">or BLE NUS</text>
</svg>
