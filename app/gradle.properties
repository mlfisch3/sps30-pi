# Portable project settings. Machine-specific bits (JDK 17 path, SDK path) are
# supplied out-of-band: JAVA_HOME must point at a JDK 17+, and local.properties
# (git-ignored) sets sdk.dir. See APK_DESIGN.md.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
